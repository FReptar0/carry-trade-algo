[project]
name = "carry-trade-algo"
version = "0.1.0"
description = "Educational algorithmic trading system focused on forex carry trade strategies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
    "jupyter>=1.0.0",
    "pytest>=7.3.0",
    "yfinance>=1.1.0",
    "fredapi>=0.5.2",
    "pyarrow>=23.0.0",
    "scipy>=1.17.0",
    "oandapyV20>=0.7.2",
    "APScheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
phase2 = [
    "yfinance>=0.2.28",
    "fredapi>=0.5.0",
    "backtesting>=0.3.3",
    "pandas-ta>=0.3.14b",
]

autonomous = [
    "finnhub-python>=2.4.0",
    "optuna>=3.6.0",
    "gymnasium>=1.0.0",
]

dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
